version: '3.8'

services:
  ai-engine:
    build: 
      context: ./Image Analysis & Freshness
    container_name: freshdetect-ai-engine
    ports:
      - "8000:8000"
    restart: unless-stopped
    volumes:
      - ./Image Analysis & Freshness:/app
    environment:
      - PYTHONUNBUFFERED=1

  backend:
    build: 
      context: ./backend
    container_name: freshdetect-backend
    ports:
      - "5000:5000"
    restart: unless-stopped
    depends_on:
      - ai-engine
    environment:
      - NODE_ENV=production
      - PORT=5000
      # Docker internal networking: Route requests to the ai-engine container
      - PYTHON_API_URL=http://ai-engine:8000

  frontend:
    build:
      context: ./frontend
    container_name: freshdetect-frontend
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      - backend
